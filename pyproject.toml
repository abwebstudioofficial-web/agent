[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "A research agent that searches the web and writes cited reports, powered by Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.8,<2"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
research-agent = "research_agent.cli:main"
research-agent-web = "research_agent.web:main"

[tool.setuptools]
packages = ["research_agent"]

[tool.setuptools.package-data]
research_agent = ["static/*"]
